<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCA - Stanza Draft</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; --neon-cyan: #00e5ff; --neon-purple: #d900ff; --dark-bg: #07030e; --panel-bg: rgba(20, 10, 40, 0.75); }
        body { background-color: var(--dark-bg); background-image: url("data:image/svg+xml,%3Csvg width='40' height='69.28' viewBox='0 0 40 69.28' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 17.32L20 5.77 0 17.32V40.41L20 51.96 40 40.41V17.32ZM20 28.86L0 17.32 20 5.77 40 17.32 20 28.86ZM0 40.41V17.32L20 28.86V51.96L0 40.41ZM40 40.41V17.32L20 28.86V51.96L40 40.41Z' fill='%23d900ff' fill-opacity='0.03' fill-rule='evenodd'/%3E"); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; text-align: left; }
        
        .box { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid rgba(0, 229, 255, 0.3); border-top: 3px solid var(--neon-cyan); border-radius: 4px; padding: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); margin-bottom: 25px; }
        h2 { color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        h2::before { content: '◈'; color: var(--neon-cyan); font-size: 18px; }
        
        select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid rgba(0, 229, 255, 0.3); background: rgba(10, 5, 20, 0.9); color: white; outline: none; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; }
        select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
        
        button { background: var(--neon-cyan); color: black; font-weight: 700; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #33eeff; box-shadow: 0 0 15px var(--neon-cyan); }
        
        /* Griglia Carte Giocatore */
        .draft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .draft-card { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(217, 0, 255, 0.3); border-left: 4px solid var(--neon-purple); border-radius: 4px; padding: 20px; text-align: center; transition: transform 0.2s; position: relative; overflow: hidden; }
        .draft-card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(217, 0, 255, 0.2); }
        .draft-card h3 { color: white; margin: 0 0 10px 0; font-size: 24px; letter-spacing: 1px; }
        .role-badge { display: inline-block; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 4px 12px; font-weight: 700; font-size: 16px; border-radius: 4px; margin-bottom: 15px; box-shadow: inset 0 0 8px rgba(0,255,136,0.2); }
        
        .buy-btn { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); padding: 8px; width: 100%; margin-top: 10px; }
        .buy-btn:hover { background: var(--neon-purple); color: white; box-shadow: 0 0 15px var(--neon-purple); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color:var(--neon-cyan); font-weight:700; display:block; text-align:left; margin-bottom:15px; text-decoration:none; text-transform:uppercase; letter-spacing:1px;">← HUB PRINCIPALE</a>
        <h1 style="color:white; margin-bottom: 30px; text-transform:uppercase; letter-spacing:2px;">🌐 HUB MERCATO & DRAFT</h1>
        
        <!-- SEZIONE FREE AGENT (Visibile solo a chi non ha un club) -->
        <div id="free-agent-section" class="box" style="display: none;">
            <h2>Candidatura Free Agent</h2>
            <p style="font-size: 15px; color: #aaa; margin-top:0;">Non hai ancora un club? Dichiara la tua disponibilità e il tuo ruolo principale per farti notare dai Capitani nel database del mercato.</p>
            <select id="draft-role">
                <option value="ATT">Attaccante Centrale (ATT)</option>
                <option value="AS">Ala Sinistra (AS)</option>
                <option value="AD">Ala Destra (AD)</option>
                <option value="COC">Trequartista (COC)</option>
                <option value="CC">Centrocampista (CC)</option>
                <option value="CDC">Mediano (CDC)</option>
                <option value="TS">Terzino Sinistro (TS)</option>
                <option value="TD">Terzino Destro (TD)</option>
                <option value="DC">Difensore Centrale (DC)</option>
                <option value="POR">Portiere (POR)</option>
            </select>
            <button onclick="iscrivitiDraft()" style="margin-top: 15px;">ENTRA NEL DATABASE DRAFT</button>
        </div>

        <!-- SEZIONE CAPITANI (Visibile solo ai Capitani/Admin) -->
        <div id="captain-section" class="box" style="display: none; border-top-color: var(--neon-purple);">
            <h2 style="color:var(--neon-purple);">Roster Disponibili</h2>
            <p style="font-size: 15px; color: #aaa; margin-top:0;">Analizza i talenti svincolati ed espandi la rosa della tua franchigia.</p>
            
            <div id="draft-grid" class="draft-grid">
                <!-- I giocatori compariranno qui -->
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("vca_user"));
        if (!user) window.location.href = "auth.html";

        async function init() {
            // Controlla lo stato dell'utente tramite API per essere sicuri
            const res = await fetch(`/api/user/profile/${user.user_id}`);
            const profile = await res.json();
            
            // Se l'utente NON ha un club, mostriamo la sezione Free Agent
            if (profile.club_name === "Nessuno") {
                document.getElementById("free-agent-section").style.display = "block";
            }
            
            // Se l'utente è Capitano o Admin, mostriamo il Database dei talenti
            if (user.role === "captain" || user.role === "admin") {
                document.getElementById("captain-section").style.display = "block";
                caricaMercato();
            }
        }

        async function iscrivitiDraft() {
            const role = document.getElementById("draft-role").value;
            const res = await fetch("/api/draft/signup", {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: user.user_id, role: role })
            });
            const data = await res.json();
            if(res.ok) {
                alert("✅ " + data.message);
                window.location.href = "dashboard_vca.html"; // Lo riportiamo alla base
            } else {
                alert("⚠️ " + data.detail);
            }
        }

        async function caricaMercato() {
            const res = await fetch("/api/draft/players");
            const players = await res.json();
            const grid = document.getElementById("draft-grid");
            
            if (players.length === 0) {
                grid.innerHTML = "<p style='color:#aaa; grid-column:1/-1;'>Nessun Free Agent attualmente nel database.</p>";
                return;
            }
            
            let html = "";
            players.forEach(p => {
                html += `
                <div class="draft-card">
                    <h3>${p.gamertag}</h3>
                    <div class="role-badge">${p.role}</div>
                    <button class="buy-btn" onclick="ingaggia(${p.id}, '${p.gamertag}')">INGAGGIA</button>
                </div>`;
            });
            grid.innerHTML = html;
        }

        async function ingaggia(playerId, playerName) {
            if(!confirm(`Confermi l'acquisizione di ${playerName} per il tuo Club?`)) return;
            
            const res = await fetch("/api/draft/assign", {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ player_id: playerId, club_id: user.club_id })
            });
            
            const data = await res.json();
            if(res.ok) {
                alert("✅ " + data.message);
                caricaMercato(); // Aggiorna la lista
            } else {
                alert("⚠️ Errore di sistema: " + data.detail);
            }
        }

        init();
    </script>
</body>
</html>
