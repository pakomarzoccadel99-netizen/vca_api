<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCA - Profilo Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #00ff88; --neon-purple: #d900ff; --neon-blue: #00d4ff; --dark-bg: #07030e; --panel-bg: rgba(20, 10, 40, 0.75); }
        body { background-color: var(--dark-bg); background-image: url("data:image/svg+xml,%3Csvg width='40' height='69.28' viewBox='0 0 40 69.28' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 17.32L20 5.77 0 17.32V40.41L20 51.96 40 40.41V17.32ZM20 28.86L0 17.32 20 5.77 40 17.32 20 28.86ZM0 40.41V17.32L20 28.86V51.96L0 40.41ZM40 40.41V17.32L20 28.86V51.96L40 40.41Z' fill='%23d900ff' fill-opacity='0.03' fill-rule='evenodd'/%3E"); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; text-align: left; }
        
        .box { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid rgba(217, 0, 255, 0.3); border-top: 4px solid var(--neon-purple); border-radius: 4px; padding: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); margin-bottom: 25px; text-align: center; }
        
        .club-name { color: white; font-size: 42px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin: 0 0 10px 0; text-shadow: 0 0 15px var(--neon-purple); }
        .club-formation { display: inline-block; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 5px 15px; border-radius: 20px; font-size: 18px; font-weight: 600; letter-spacing: 1px; box-shadow: inset 0 0 10px rgba(0, 212, 255, 0.2); }
        
        h2 { color: var(--neon-green); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 40px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; text-align: left;}
        h2::before { content: '🛡️'; font-size: 20px; }

        /* Griglia Giocatori */
        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .player-card { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 136, 0.3); border-left: 4px solid var(--neon-green); border-radius: 4px; padding: 20px; transition: transform 0.2s; position: relative; overflow: hidden; text-align: left; }
        .player-card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0, 255, 136, 0.15); }
        
        .player-name { color: white; margin: 0 0 15px 0; font-size: 22px; font-weight: 700; letter-spacing: 1px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 8px; }
        .captain-badge { background: var(--neon-purple); color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 10px; vertical-align: middle; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 16px; font-weight: 600; color: #aaa; }
        .stat-row b { color: white; font-size: 18px; }
        .stat-row .goals { color: var(--neon-green); }
        .stat-row .assists { color: var(--neon-purple); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Usa history.back() per tornare esattamente alla pagina da cui si è arrivati -->
        <a href="javascript:history.back()" style="color:var(--neon-purple); font-weight:700; display:block; text-align:left; margin-bottom:20px; text-decoration:none; text-transform:uppercase; letter-spacing:1px;">← TORNA INDIETRO</a>
        
        <div id="club-header" class="box">
            <h1 class="club-name" id="display-name">Caricamento Dati...</h1>
            <div class="club-formation" id="display-formation">---</div>
        </div>

        <h2>ROSTER UFFICIALE</h2>
        <div id="roster-container" class="roster-grid">
            <!-- Le carte dei giocatori appariranno qui -->
        </div>
    </div>

    <script>
        async function caricaClub() {
            // Estrae l'ID del club dall'URL (es. club_vca.html?id=3)
            const urlParams = new URLSearchParams(window.location.search);
            const clubId = urlParams.get('id');

            if(!clubId) {
                document.getElementById("display-name").innerText = "ERRORE DI SISTEMA";
                document.getElementById("display-name").style.color = "#ff0055";
                document.getElementById("display-formation").innerText = "ID Club non fornito";
                return;
            }

            try {
                const res = await fetch(`/api/club/details/${clubId}`);
                if(!res.ok) throw new Error("Club non trovato");
                
                const data = await res.json();
                
                // Popola l'intestazione
                document.getElementById("display-name").innerText = data.name;
                document.getElementById("display-formation").innerText = `Modulo: ${data.formation}`;
                
                // Popola i giocatori
                const rosterContainer = document.getElementById("roster-container");
                if(data.players.length === 0) {
                    rosterContainer.innerHTML = "<p style='color:#aaa;'>Nessun operatore attualmente sotto contratto.</p>";
                    return;
                }

                let html = "";
                data.players.forEach(p => {
                    let capBadge = p.role === "captain" ? '<span class="captain-badge">CAPITANO</span>' : '';
                    html += `
                    <div class="player-card">
                        <h3 class="player-name">${p.gamertag} ${capBadge}</h3>
                        <div class="stat-row"><span>Partite Giocate:</span> <b>${p.matches_played}</b></div>
                        <div class="stat-row"><span>Reti Segnate:</span> <b class="goals">${p.goals}</b></div>
                        <div class="stat-row"><span>Assist Effettuati:</span> <b class="assists">${p.assists}</b></div>
                    </div>`;
                });
                
                rosterContainer.innerHTML = html;

            } catch (error) {
                document.getElementById("display-name").innerText = "DATI CORROTTI";
                document.getElementById("display-name").style.color = "#ff0055";
            }
        }

        caricaClub();
    </script>
</body>
</html>
